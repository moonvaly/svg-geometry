<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何动画题库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 60px;
  }
  header {
    text-align: center; margin-bottom: 40px;
  }
  header h1 {
    font-size: 28px; font-weight: 600; color: #e6edf3;
    margin-bottom: 8px;
  }
  header p {
    font-size: 15px; color: #8b949e;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1100px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
    display: flex; flex-direction: column;
  }
  .card:hover {
    border-color: #58a6ff;
    background: #1c2128;
    transform: translateY(-2px);
  }
  .card .num {
    font-size: 12px; font-weight: 600; color: #58a6ff;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .card h2 {
    font-size: 18px; font-weight: 500; color: #e6edf3;
    margin-bottom: 10px;
  }
  .card p {
    font-size: 13px; color: #8b949e; line-height: 1.6;
    flex: 1;
  }
  .card .tags {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 14px;
  }
  .card .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: #21262d; color: #8b949e;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center; padding: 60px 20px;
    color: #484f58; font-size: 15px;
  }
  .empty strong { display: block; margin-bottom: 6px; color: #8b949e; }
</style>
</head>
<body>
  <header>
    <h1>几何动画题库</h1>
    <p>选择一道题目查看 SVG 动画演示</p>
  </header>
  <div class="grid" id="problemGrid"></div>
  <script>
    // Problem definitions — add new entries here when creating new problem files
    const problems = [
      {
        file: 'problems/p1.html',
        title: '正方形ABCD旋转',
        description: '正方形ABCD中，△BPQ绕点B旋转至△BMN，点E为ND中点，探究E点轨迹。',
        tags: ['旋转', '轨迹', '中点'],
      },
      {
        file: 'problems/p2.html',
        title: '矩形CDGH中线段OB最小值',
        description: 'AB=8，△ACD是边长为3的等边三角形。过点D作DP⊥CD，矩形CDGH的对角线交点为O，求OB的最小值。',
        tags: ['等边三角形', '矩形', '动点', '最小值'],
      },
      {
        file: 'problems/p3.html',
        title: '菱形ABCD中AG的最小值',
        description: '菱形ABCD边长4，∠ABC=60°，E、F在AB、CD上且AE=CF，BG⊥EF于G，求AG的最小值。',
        tags: ['菱形', '动点', '垂足', '最小值'],
      },
    ];

    const grid = document.getElementById('problemGrid');

    if (problems.length === 0) {
      grid.innerHTML = '<div class="empty"><strong>暂无题目</strong>请在 index.html 的 problems 数组中添加题目定义</div>';
    } else {
      for (const [i, p] of problems.entries()) {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = p.file;
        card.innerHTML = `
          <div class="num">题目 ${i + 1}</div>
          <h2>${p.title}</h2>
          <p>${p.description}</p>
          <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        `;
        grid.appendChild(card);
      }
    }
  </script>
</body>
</html>
